<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Bunny - Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #e0f2f1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }
        
        .logo h1 {
            color: #2d7a3e;
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .logo p {
            color: #5dd9c1;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #2d7a3e;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0f2f1;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #2d7a3e;
            box-shadow: 0 0 10px rgba(45, 122, 62, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #2d7a3e 0%, #1d5a2e 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(45, 122, 62, 0.3);
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
        
        .login-link a {
            color: #2d7a3e;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .login-link a:hover {
            color: #5dd9c1;
        }
.error-msg {
    color: #d32f2f;
    font-size: 14px;
    margin-bottom: 12px;
    min-height: 18px;
}
    </style>
<style id="pb-extra">
.terms-note{font-size:12px;color:#777;text-align:center;margin-top:14px;line-height:1.6}.terms-note a{color:#2d7a3e;font-weight:600;text-decoration:none}.terms-note a:hover{text-decoration:underline}
</style>
<style id="pb-dark">
html[data-theme="dark"] .container{background-color:#1d2621}
html[data-theme="dark"] .logo h1{color:#ade1b8}
html[data-theme="dark"] .logo p{color:#66d9c3}
html[data-theme="dark"] label{color:#ade1b8}
html[data-theme="dark"] input{border-color:#335c5a}
html[data-theme="dark"] input:focus{border-color:#2d7a3e}
html[data-theme="dark"] .btn{color:white}
html[data-theme="dark"] .login-link{color:#b7c2bd}
html[data-theme="dark"] .login-link a{color:#ade1b8}
html[data-theme="dark"] .login-link a:hover{color:#66d9c3}
html[data-theme="dark"] .error-msg{color:#df7d7d}
html[data-theme="dark"]{background:#0d1712;color-scheme:dark}
html[data-theme="dark"] body{background:linear-gradient(135deg,#0d1712 0%,#12201a 100%);background-color:#0d1712;color:#d9e8de}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background-color:#14211a;color:#e4efe8;border-color:#34503f}
html[data-theme="dark"] input::placeholder,html[data-theme="dark"] textarea::placeholder{color:#7f9a8a}
html[data-theme="dark"] input:focus,html[data-theme="dark"] select:focus,html[data-theme="dark"] textarea:focus{border-color:#5ec27a}
html[data-theme="dark"] .toggle-circle{background-color:#fff}
html[data-theme="dark"] select option{background:#14211a;color:#e4efe8}
html[data-theme="dark"] [style*="#f5f5f5"]{background:#22302a !important}
html[data-theme="dark"] [style*="#2d7a3e"],html[data-theme="dark"] [style*="rgb(45, 122, 62)"],html[data-theme="dark"] [style*="#388e3c"],html[data-theme="dark"] [style*="rgb(56, 142, 60)"]{color:#7ddb98 !important}
html[data-theme="dark"] [style*="#999"]{color:#9db3a5 !important}
html[data-theme="dark"] [style*="#d32f2f"],html[data-theme="dark"] [style*="rgb(211, 47, 47)"]{color:#ff8a8a !important}
html[data-theme="dark"] .terms-note{color:#9db3a5}html[data-theme="dark"] .terms-note a{color:#7ddb98}
</style>
<script src="theme.js"></script>
</head>

        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm your password" required>
            </div>
            <p id="errorMsg" class="error-msg"></p>
<button type="submit" class="btn" id="signupBtn">Create Account</button>
            <p class="terms-note">By creating an account you agree to our
                <a href="terms-of-service.html">Terms of Service</a> and
                <a href="privacy-policy.html">Privacy Policy</a>.</p>
        </form>
        
        <div class="login-link">
            Already have an account? <a onclick="goToLogin()">Sign In</a>
        </div>
    </div>
    
        <script src="api.js"></script>
<script>
    // Already signed in? Go straight to the home page.
    pbRedirectIfSignedIn();

    document.getElementById('signupForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = document.getElementById('signupBtn');
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.textContent = '';

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm-password').value;

        if (!name) { errorMsg.textContent = 'Please enter your name'; return; }
        if (password.length < 6) { errorMsg.textContent = 'Password must be at least 6 characters'; return; }
        if (password !== confirm) { errorMsg.textContent = 'Passwords do not match'; return; }

        btn.disabled = true;
        btn.textContent = 'Creating account...';

        try {
            // The server creates the account AND returns a login token.
            let data = await apiFetch('/auth/register', {
                method: 'POST',
                body: JSON.stringify({ fullName: name, email: email, password: password })
            });
            if (!data.token) {
                data = await apiFetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email: email, password: password })
                });
            }
            if (!data.token) throw new Error('Account created, but no token was returned. Please sign in.');
            setToken(data.token);
            window.location.replace('home.html');
        } catch (err) {
            errorMsg.textContent = err.message;
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
